<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>CS544 Flashcards</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171b21;
    --panel-2: #1e242c;
    --border: #2a313b;
    --text: #eef1f5;
    --muted: #9aa5b1;
    --accent: #5b9dff;
    --accent-2: #7c5cff;
    --good: #3ecf8e;
    --bad: #ff6b6b;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f9;
      --panel: #ffffff;
      --panel-2: #eef1f6;
      --border: #dde3ea;
      --text: #171b21;
      --muted: #5b6472;
      --shadow: 0 10px 30px rgba(20,30,50,0.08);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  h1 {
    font-size: 1.15rem;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  h1 span { color: var(--accent); }
  .deckbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .deck-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 999px;
    font-size: 0.88rem;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .deck-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .stats {
    display: flex;
    gap: 14px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .stats b { color: var(--text); }
  .icon-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1rem;
  }
  .icon-btn:active { transform: scale(0.94); }

  .progress-track {
    height: 5px;
    width: 100%;
    background: var(--panel-2);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    width: 0%;
    transition: width 0.25s ease;
  }

  .card-wrap {
    perspective: 1600px;
    width: 100%;
    min-height: 300px;
    flex: 1;
  }
  .card {
    position: relative;
    width: 100%;
    min-height: 300px;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--panel);
    box-shadow: var(--shadow);
    padding: 26px 22px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .face .tag {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .face .content {
    flex: 1;
    display: flex;
    align-items: center;
    font-size: 1.15rem;
    line-height: 1.5;
  }
  .face .content div, .face .content p { margin: 0 0 8px; }
  .face .hint {
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 10px;
  }
  .back-face { transform: rotateY(180deg); background: var(--panel-2); }
  .back-face .content { font-size: 1.05rem; }
  .back-face .content code, .back-face .content b {
    color: var(--accent);
  }

  .nav-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    height: 46px;
    width: 46px;
    border-radius: 12px;
    font-size: 1.1rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .nav-btn:active { transform: scale(0.94); }

  .grade-row {
    display: flex;
    gap: 10px;
    flex: 1;
  }
  .grade-btn {
    flex: 1;
    height: 46px;
    border-radius: 12px;
    border: 1px solid var(--border);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
  }
  .grade-btn.again { background: var(--bad); border-color: var(--bad); }
  .grade-btn.good { background: var(--good); border-color: var(--good); }
  .grade-btn:active { transform: scale(0.97); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
  }
  .empty button {
    margin-top: 14px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 0.9rem;
    cursor: pointer;
  }

  footer {
    text-align: center;
    font-size: 0.72rem;
    color: var(--muted);
    padding-top: 4px;
  }

  @media (max-width: 420px) {
    h1 { font-size: 1rem; }
    .face { padding: 20px 16px; }
    .face .content { font-size: 1.05rem; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>CS544 <span>Flashcards</span></h1>
    <button class="icon-btn" id="shuffleBtn" title="Shuffle">&#128256;</button>
  </header>

  <div class="deckbar" id="deckbar"></div>

  <div class="toolbar">
    <div class="stats">
      <span>Card <b id="posLabel">0/0</b></span>
      <span>Mastered <b id="masteredLabel">0</b></span>
    </div>
    <button class="icon-btn" id="resetBtn" title="Reset progress for this deck">&#8635;</button>
  </div>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="card-wrap" id="cardWrap">
    <div class="card" id="card">
      <div class="face front-face">
        <div class="tag" id="frontTag">Question</div>
        <div class="content" id="frontContent"></div>
        <div class="hint">Tap card or press Space to flip</div>
      </div>
      <div class="face back-face">
        <div class="tag">Answer</div>
        <div class="content" id="backContent"></div>
        <div class="hint">Tap again to flip back</div>
      </div>
    </div>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="prevBtn">&#8592;</button>
    <div class="grade-row">
      <button class="grade-btn again" id="againBtn">Again</button>
      <button class="grade-btn good" id="goodBtn">Good</button>
    </div>
    <button class="nav-btn" id="nextBtn">&#8594;</button>
  </div>

  <footer>Space/tap flip &middot; ← → navigate &middot; 1 again &middot; 2 good &middot; progress saved on this device</footer>
</div>

<script>
(function () {
  var STORAGE_KEY = "cs544_flashcards_progress_v1";

  var state = {
    decks: {},
    deckOrder: [],
    activeDeck: "all",
    order: [],
    index: 0,
    flipped: false,
    progress: loadProgress()
  };

  function loadProgress() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
    } catch (e) {}
  }

  function cardKey(deckId, idx) {
    return deckId + "::" + idx;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildAllCards() {
    var all = [];
    state.deckOrder.forEach(function (deckId) {
      state.decks[deckId].cards.forEach(function (c, i) {
        all.push({ deckId: deckId, idx: i, front: c.front, back: c.back });
      });
    });
    return all;
  }

  function currentCardList() {
    if (state.activeDeck === "all") return buildAllCards();
    var deck = state.decks[state.activeDeck];
    return deck.cards.map(function (c, i) {
      return { deckId: state.activeDeck, idx: i, front: c.front, back: c.back };
    });
  }

  function setActiveDeck(deckId, opts) {
    state.activeDeck = deckId;
    state.order = currentCardList();
    state.index = 0;
    state.flipped = false;
    renderDeckbar();
    render();
  }

  function renderDeckbar() {
    var bar = document.getElementById("deckbar");
    bar.innerHTML = "";
    var items = [{ id: "all", title: "All" }].concat(
      state.deckOrder.map(function (id) { return { id: id, title: state.decks[id].title }; })
    );
    items.forEach(function (item) {
      var btn = document.createElement("button");
      btn.className = "deck-btn" + (state.activeDeck === item.id ? " active" : "");
      var count = item.id === "all" ? buildAllCards().length : state.decks[item.id].cards.length;
      btn.textContent = item.title + " (" + count + ")";
      btn.onclick = function () { setActiveDeck(item.id); };
      bar.appendChild(btn);
    });
  }

  function masteredCount() {
    var n = 0;
    state.order.forEach(function (c) {
      if (state.progress[cardKey(c.deckId, c.idx)] === "good") n++;
    });
    return n;
  }

  function render() {
    var card = state.order[state.index];
    var cardEl = document.getElementById("card");
    var wrap = document.getElementById("cardWrap");

    if (!card) {
      document.getElementById("posLabel").textContent = "0/0";
      document.getElementById("masteredLabel").textContent = "0";
      document.getElementById("progressFill").style.width = "0%";
      wrap.innerHTML = '<div class="empty">No cards in this deck.<br><button onclick="location.reload()">Reload</button></div>';
      return;
    }

    if (!document.getElementById("card")) {
      location.reload();
      return;
    }

    cardEl.classList.toggle("flipped", state.flipped);
    document.getElementById("frontContent").innerHTML = card.front;
    document.getElementById("backContent").innerHTML = card.back;
    document.getElementById("frontTag").textContent =
      state.activeDeck === "all" ? state.decks[card.deckId].title : "Question";

    document.getElementById("posLabel").textContent = (state.index + 1) + "/" + state.order.length;
    document.getElementById("masteredLabel").textContent = masteredCount();
    var pct = Math.round((masteredCount() / state.order.length) * 100);
    document.getElementById("progressFill").style.width = pct + "%";
  }

  function flip() {
    if (!state.order[state.index]) return;
    state.flipped = !state.flipped;
    document.getElementById("card").classList.toggle("flipped", state.flipped);
  }

  function goTo(newIndex) {
    if (!state.order.length) return;
    state.index = (newIndex + state.order.length) % state.order.length;
    state.flipped = false;
    render();
  }

  function grade(result) {
    var card = state.order[state.index];
    if (!card) return;
    state.progress[cardKey(card.deckId, card.idx)] = result;
    saveProgress();
    goTo(state.index + 1);
  }

  function resetDeckProgress() {
    state.order.forEach(function (c) {
      delete state.progress[cardKey(c.deckId, c.idx)];
    });
    saveProgress();
    render();
  }

  function init(data) {
    state.decks = data;
    state.deckOrder = Object.keys(data);
    setActiveDeck("all");

    document.getElementById("card").addEventListener("click", flip);
    document.getElementById("prevBtn").addEventListener("click", function () { goTo(state.index - 1); });
    document.getElementById("nextBtn").addEventListener("click", function () { goTo(state.index + 1); });
    document.getElementById("againBtn").addEventListener("click", function () { grade("again"); });
    document.getElementById("goodBtn").addEventListener("click", function () { grade("good"); });
    document.getElementById("resetBtn").addEventListener("click", function () {
      if (confirm("Reset progress for this deck view?")) resetDeckProgress();
    });
    document.getElementById("shuffleBtn").addEventListener("click", function () {
      state.order = shuffle(state.order);
      state.index = 0;
      state.flipped = false;
      render();
    });

    document.addEventListener("keydown", function (e) {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (e.code === "Space") { e.preventDefault(); flip(); }
      else if (e.key === "ArrowRight") goTo(state.index + 1);
      else if (e.key === "ArrowLeft") goTo(state.index - 1);
      else if (e.key === "1") grade("again");
      else if (e.key === "2") grade("good");
    });

    var startX = null;
    wrapSwipe();
    function wrapSwipe() {
      var wrap = document.getElementById("cardWrap");
      wrap.addEventListener("touchstart", function (e) {
        startX = e.touches[0].clientX;
      }, { passive: true });
      wrap.addEventListener("touchend", function (e) {
        if (startX === null) return;
        var dx = e.changedTouches[0].clientX - startX;
        if (Math.abs(dx) > 60) {
          if (dx < 0) goTo(state.index + 1); else goTo(state.index - 1);
        }
        startX = null;
      });
    }
  }

  fetch("cards.json")
    .then(function (r) { return r.json(); })
    .then(init)
    .catch(function (err) {
      document.getElementById("cardWrap").innerHTML =
        '<div class="empty">Could not load cards.json.<br>' + err + "</div>";
    });
})();
</script>
</body>
</html>
